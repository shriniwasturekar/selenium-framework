# Project
project.name = AuditManager

# browser defaults
browser=chrome
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# selenium
retry.count=1
headless=false

# reporting
screenshot.on.failure=true

# framework
base.path=/login

# extentreport

extentreport.title = Report | Automation Framework Selenium | Shriniwas
extentreport.name = ExtentReports
extentreport.folder = exports/ExtentReports
extentreport.attachment = exports/ExtentData
extentreport.override = no